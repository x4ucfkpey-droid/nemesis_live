<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0b0e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>NEMESIS LIVE — ライブHH記録</title>
<style>
:root{--bg:#0a0b0e;--card:#12141a;--ink:#eceef2;--mut:#868b98;--line:#22252e;--red:#e63946;
      --green:#2f9e63;--blue:#3f6bb0;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;
     padding-bottom:calc(64px + var(--sab))}
header{padding:calc(10px + var(--sat)) 16px 10px;position:sticky;top:0;background:var(--bg);z-index:5}
header::after{content:"";display:block;height:2px;margin:8px -16px -10px;
  background:linear-gradient(90deg,var(--red) 0,#b32836 120px,var(--line) 320px,var(--line))}
h1{font-size:18px;margin:0;font-weight:900;letter-spacing:.2em}
h1 i{color:var(--red);font-style:normal}
h1 em{font-style:normal;font-weight:400;letter-spacing:.08em;color:var(--mut);font-size:13px}
#view{padding:12px 14px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px;margin-bottom:11px}
.card.hot{border-color:var(--red);cursor:pointer}
.card.kpi{margin:0;padding:11px}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px}
.lbl{color:var(--mut);font-size:12px;margin-bottom:6px}
.f-lbl{display:block;color:var(--mut);font-size:12px;margin:10px 0 4px}
.big{font-size:19px;font-weight:700}
.mut{color:var(--mut)}
.note{font-size:11px;color:var(--mut);margin-top:8px;line-height:1.7}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left;color:var(--mut)}
th{color:var(--mut);font-weight:400;font-size:11px}
td.big{font-size:15px}
/* buttons */
.btn{padding:11px 14px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink);
     font-size:14px;cursor:pointer;font-family:inherit;min-height:44px}
.btn.sm{padding:6px 10px;min-height:32px;font-size:12px;color:var(--mut)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.btn.danger{color:var(--red);border-color:#5a2229}
.btn.cta{width:100%;margin-bottom:11px;font-size:16px;min-height:52px}
.btn:disabled{opacity:.35}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.inp{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0d0f14;color:var(--ink);
     font-size:16px;font-family:inherit} /* 16px未満はiOSがフォーカス時に勝手にズームする */
.inp.sm{width:auto;padding:6px 8px;font-size:16px}
textarea.inp{resize:vertical}
select.inp{-webkit-appearance:none;appearance:none}
/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.sm .chip{padding:4px 9px;font-size:11px;min-height:26px}
.chip{padding:8px 12px;border-radius:16px;border:1px solid var(--line);background:transparent;color:var(--mut);
      font-size:13px;cursor:pointer;font-family:inherit;min-height:34px}
.chip.on{background:#2a1418;border-color:var(--red);color:var(--ink)}
.chip.big{font-size:15px;padding:10px 16px}
.chip.ro{pointer-events:none}
/* list */
.list-item{display:block;width:100%;text-align:left;padding:11px 4px;border:0;border-bottom:1px solid var(--line);
           background:transparent;color:var(--ink);font-size:14px;cursor:pointer;font-family:inherit}
.list-item:last-child{border-bottom:0}
/* cards(トランプ) */
.cardv{display:inline-block;font-weight:800;font-size:15px;padding:0 2px}
.cardv.big{font-size:22px;padding:0 3px}
.cardv.empty{color:var(--mut);border:1px dashed var(--line);border-radius:4px;padding:0 7px}
.board{display:flex;gap:6px;justify-content:center;min-height:30px;align-items:center}
/* recorder */
.rec-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.rec-pot{font-size:15px;color:var(--mut)}
.rec-pot b{color:var(--ink);font-size:17px}
.pos-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.pos-cell{text-align:center;border:1px solid var(--line);border-radius:8px;padding:4px 2px;background:#0d0f14}
.pos-cell.sel{border-color:var(--red);background:#2a1418}
.pos-cell.live{border-color:#3a4152}
.pos-cell.dead{opacity:.3}
.pos-cell.allin{border-color:#e0a13b}
.pos-cell.done{opacity:.75}
.pos-btn{border:0;background:transparent;color:var(--ink);font-weight:800;font-size:13px;padding:4px 0;width:100%;font-family:inherit}
.pos-put{font-size:10px;color:#e0a13b;min-height:13px}
.pos-name{border:0;background:transparent;color:var(--blue);font-size:11px;padding:4px 0;width:100%;font-family:inherit;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos-stack{border:0;background:transparent;color:var(--mut);font-size:11px;padding:4px 0 5px;width:100%;font-family:inherit;
           text-decoration:underline dotted}
.act-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn.act{min-height:56px;font-size:15px;font-weight:700}
.btn.act.fold{color:var(--mut)}
.btn.act.call{border-color:#2c5e44;color:#5ecb96}
.btn.act.raise{border-color:var(--red);color:#ef6a75}
.sd-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.sd-row:last-child{border-bottom:0}
.hh-pre{font-size:10.5px;line-height:1.5;color:var(--mut);overflow-x:auto;background:#0d0f14;border-radius:8px;padding:10px;
        font-family:ui-monospace,Menlo,Consolas,monospace}
/* exploit reads */
.read-row{padding:9px 0;border-bottom:1px solid var(--line)}
.read-row:last-of-type{border-bottom:0}
.read-head{display:flex;align-items:center;gap:7px;font-size:13.5px}
.read-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.read-conf{margin-left:auto;color:var(--mut);font-size:10px;white-space:nowrap}
.read-ex{color:var(--mut);font-size:12px;margin-top:3px;line-height:1.6;padding-left:16px}
/* bottom nav */
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0d0f14;border-top:1px solid var(--line);
     padding-bottom:var(--sab);z-index:10}
.nav-btn{flex:1;border:0;background:transparent;color:var(--mut);font-size:10px;padding:8px 0 6px;cursor:pointer;font-family:inherit}
.nav-btn.on{color:var(--red)}
.nav-ic{display:block;font-size:17px;margin-bottom:2px}
/* sheet */
.sheet-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;opacity:0;transition:opacity .18s}
.sheet-ov.on{opacity:1}
.sheet{position:absolute;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
       border-radius:16px 16px 0 0;padding:16px 16px calc(16px + var(--sab));max-height:82vh;overflow-y:auto;
       transform:translateY(100%);transition:transform .18s;max-width:640px;margin:0 auto}
.sheet-ov.on .sheet{transform:translateY(0)}
.sh-title{font-size:15px;font-weight:700;margin-bottom:12px}
/* card picker */
.cp-sel{display:flex;gap:8px;justify-content:center;margin-bottom:12px;min-height:34px}
.cp-card{border:0;background:transparent;padding:0;font-family:inherit}
.cp-ranks{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:10px}
.cp-r{padding:11px 0;border-radius:8px;border:1px solid var(--line);background:#0d0f14;color:var(--ink);
      font-size:16px;font-weight:700;font-family:inherit;min-height:44px}
.cp-r.on{border-color:var(--red);background:#2a1418}
.cp-r:disabled{opacity:.25}
.cp-suits{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cp-s{padding:8px 0;border-radius:8px;border:1px solid var(--line);background:#0d0f14;font-size:26px;min-height:52px;font-family:inherit}
.cp-s:disabled{opacity:.2}
/* numpad */
.np-disp{text-align:center;font-size:26px;font-weight:700;padding:8px;background:#0d0f14;border-radius:8px;margin-bottom:10px}
.np-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.np-k{padding:13px 0;border-radius:8px;border:1px solid var(--line);background:#0d0f14;color:var(--ink);
      font-size:19px;font-family:inherit;min-height:50px}
.qk-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.btn.qk{padding:7px 2px;font-size:12px;min-height:46px;line-height:1.3}
.btn.qk .mut{font-size:10px}
/* toast */
.toast{position:fixed;bottom:calc(76px + var(--sab));left:50%;transform:translate(-50%,10px);background:#1d2027;
       border:1px solid var(--line);color:var(--ink);padding:10px 18px;border-radius:20px;font-size:13px;z-index:30;
       opacity:0;transition:all .25s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style></head>
<body>
<header><h1>NEMESIS<i>.</i> <em>LIVE</em></h1></header>
<main id="view"></main>
<nav id="nav"></nav>
<script src="js/store.js"></script>
<script src="js/engine.js"></script>
<script src="js/export.js"></script>
<script src="js/gtolink.js"></script>
<script src="js/stats.js"></script>
<script src="js/reads.js"></script>
<script src="js/ui.js"></script>
<script src="js/review.js"></script>
<script src="js/recorder.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body></html>
